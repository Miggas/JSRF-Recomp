# Builds jsrf_launcher for Windows and Linux with Zig (no game code in it).
# A tag "launcher-v..." also puts both on a release.
name: launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["launcher/**", "xboxrecomp/cmake/sdl2.cmake", "jsrf_recomp/cmake/zig.cmake", ".github/workflows/launcher.yml"]
    tags: ["launcher-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsdl2-2.0-0
          pip install ziglang==0.13.0 cmake==3.31.6 ninja==1.11.1.4
          mkdir -p zw
          for m in cc c++ ar ranlib; do
            printf '#!/bin/sh\nexec python3 -m ziglang %s "$@"\n' "$m" > zw/zig-$m
            chmod +x zw/zig-$m
          done

      - name: Linux
        run: |
          cmake -S launcher -B b-linux -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/jsrf_recomp/cmake/zig.cmake \
            -DZIG_BIN=$PWD/zw -DXBOXRECOMP_SDL2_RUNTIME=ON
          cmake --build b-linux

      - name: Windows
        run: |
          cmake -S launcher -B b-win -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/jsrf_recomp/cmake/zig.cmake \
            -DZIG_BIN=$PWD/zw -DZIG_TARGET=x86_64-windows-gnu
          cmake --build b-win

      - name: Package
        run: |
          mkdir -p out
          cp b-linux/jsrf_launcher out/
          cp b-win/jsrf_launcher.exe out/
          cd out && tar -czf jsrf_launcher-linux.tar.gz jsrf_launcher && zip -q jsrf_launcher-windows.zip jsrf_launcher.exe

      - uses: actions/upload-artifact@v4
        with:
          name: jsrf_launcher
          path: |
            out/jsrf_launcher-linux.tar.gz
            out/jsrf_launcher-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/jsrf_launcher-linux.tar.gz out/jsrf_launcher-windows.zip \
            --title "Launcher $GITHUB_REF_NAME" --notes "jsrf_launcher for Windows and Linux (Steam Deck). See the README."
