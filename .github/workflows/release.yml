# Builds the launcher for Windows and Linux with the build scripts.
# A release made on GitHub (Releases -> Draft a new release, a new tag
# "launcher-v...", target "launcher") gets both attached a few minutes
# later; pushing such a tag makes the release by itself. Running it by
# hand (Actions -> launcher -> Run workflow) keeps them as a download on
# that run.
name: launcher

on:
  workflow_dispatch:
  push:
    tags: ["launcher-v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q libsdl2-2.0-0
      - run: bash build_launcher.sh
      - run: tar -czf jsrf_launcher-linux.tar.gz jsrf_launcher
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: jsrf_launcher-linux.tar.gz }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: .\build_launcher.bat
        shell: cmd
      - run: Compress-Archive jsrf_launcher.exe jsrf_launcher-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: jsrf_launcher-windows.zip }

  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="linux/jsrf_launcher-linux.tar.gz windows/jsrf_launcher-windows.zip"
          # made on the website: add the files to it; a pushed tag: make it
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" \
              --title "Launcher $GITHUB_REF_NAME" \
              --notes "jsrf_launcher for Windows and Linux (Steam Deck). See the README on the main branch."
          fi
