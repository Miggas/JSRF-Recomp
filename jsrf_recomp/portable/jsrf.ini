; ============================================================================
;  Jet Set Radio Future - settings
;
;  Keep this file next to jsrf_recomp.exe. Remove the ; at the start of a
;  line to turn that setting on. Steam launch options override this file.
; ============================================================================

[game]
; --- Needed for the game to run. Don't change.
RECOMP_PB_EXEC=1
RECOMP_VBLANK=1
RECOMP_FB_WINDOW=1
RECOMP_TITLE_KEVENTS=1
RECOMP_AC97_READY=1
RECOMP_USB=1
RECOMP_KEYBOARD=1
RECOMP_KERNEL_LOG_BUDGET=0
RECOMP_WATCHDOG_SECS=0

; --- Fewer log messages (faster). Comment out when making a log for a bug report.
RECOMP_QUIET=1

; --- Skip the intro logos.
;RECOMP_SKIP_INTRO=1

; --- Refuse saves from other sources (real Xbox, emulators, save editors), like the Xbox does.
;RECOMP_SAVE_STRICT=1

[display]
; --- Internal resolution: 1 = 640x480, 2 = 1280x960, 3 = 1920x1440, 4 = 2560x1920.
;     2 is best for the Steam Deck.
RECOMP_GL_SCALE=2

; --- Anisotropic filtering: 2, 4, 8 or 16.
RECOMP_GL_ANISO=16

; --- Anti-aliasing (FXAA). A higher RECOMP_GL_SCALE also smooths edges.
;RECOMP_GL_FXAA=1

; --- Pop-in (buildings appearing as you get close)
;     hops = fixes almost all of it (default)
;     game = original behaviour, like on the Xbox
;     all  = draw everything (can show far-away copies on looping maps)
;     For further reach use hops3, hops4...
;RECOMP_DRAW_AREAS=game
;RECOMP_DRAW_AREAS=all

;     Pieces that should NOT be drawn (format: MapID:area,area;MapID:area)
RECOMP_DRAW_AREAS_SKIP=EE7A:96,105

;     Pieces that should ALWAYS be drawn (same format)
;RECOMP_DRAW_AREAS_ADD=

;     Area picker, to find the numbers for the two lists above
;     1 = skip mode, 2 = add mode
;     F6/F7 = select an area (shown in the window title), F8 = toggle it,
;     F10 = clear all. The list is written to the log, ready to copy.
;RECOMP_AREA_PICKER=1

; --- Draw distance of street objects (tanks, police, vehicles...). 1 = original.
RECOMP_OBJ_DRAW_DIST=2

; --- Start in full screen. F11 or Alt+Enter switches.
RECOMP_FULLSCREEN=1

; --- Borderless window (Windows only). Due to how the recomp is built, may cause performance drops.
;RECOMP_GL_PRESENT=dxgi

; --- Widescreen: 1 = 16:9, auto = your monitor's shape. Other shapes: RECOMP_ASPECT=w:h (e.g. 16:10).
RECOMP_WIDESCREEN=auto

; --- VSync.
;RECOMP_GL_VSYNC=1

[input]
; --- Number of players (1 to 4). With 2 or more, players join in the order they press a button.
RECOMP_USB_PADS=1

; --- Controller rumble: 0 = off, 1 to 100 = strength in percent.
;RECOMP_RUMBLE=100

[audio]
; --- Master volume (default 0.5).
;RECOMP_APU_GAIN=0.5

[files]
; --- Write a log, for bug reports.
;RECOMP_LOG=stderr.txt

; --- Performance profiling in the log. Slows the game down.
;RECOMP_PROFILE=1

[compatibility]
; --- If the game stutters (e.g. Steam Deck), leave at 0.
RECOMP_GL_TEX_WATCH=0

; --- GPU waits: vblank = default, all = lowest power use (may cause dips), none = highest CPU use.
;     Steam Deck: all + CPU governor "performance" (Decky PowerTools) halves power use at 60 fps.
;RECOMP_SLEEP_WAITS=vblank
